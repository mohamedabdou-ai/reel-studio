<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعداداتك — Reel Studio</title>
  <link rel="stylesheet" href="/fonts.css?token=__TOKEN__" id="font-styles">
  <link rel="stylesheet" href="/app.css?token=__TOKEN__">
  <script type="module" src="/app.js?token=__TOKEN__"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="خطوات الإعداد">
      <a class="logo" href="?token=__TOKEN__" aria-label="Reel Studio"><span class="logo-mark" aria-hidden="true">R</span><span dir="ltr">REEL STUDIO<small>أسلوبك. في كل فيديو.</small></span></a>
      <div class="sidebar-intro"><span class="eyebrow">مساحتك الإبداعية</span><h1>خلّي الاستوديو<br>يفهم ذوقك.</h1><p>اختيارات بسيطة، تتحفظ لك.<br>وكل فيديو ياخد حقه.</p></div>
      <nav id="steps"></nav>
      <div class="privacy-note"><span aria-hidden="true">◉</span><p>إعداداتك على جهازك.<br>تقدر ترجع تغيّرها في أي وقت.</p></div>
      <span class="edition" id="edition" dir="ltr"></span>
    </aside>
    <main>
      <header class="topbar"><span id="user-label">إعداد الاستوديو</span><span class="local-badge"><span aria-hidden="true"></span>على جهازك</span></header>
      <div class="workspace">
        <div class="step-meta"><span id="step-number"></span><span id="save-state">جاهز لاختياراتك</span></div>
        <section id="content" aria-labelledby="page-title"><p>بنفتح إعداداتك…</p></section>
        <div id="error" class="error" role="alert" hidden></div>
        <footer id="actions" class="actions"></footer>
      </div>
    </main>
  </div>
  <noscript>الشاشة محتاجة JavaScript. خلي المساعد يساعدك تفعّله أو يظبط الإعدادات معاك في المحادثة.</noscript>
</body>
</html>
