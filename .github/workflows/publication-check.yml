name: Check publication content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Audit authored release history, not GitHub's temporary PR merge author.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/publication-check.mjs
      - run: node scripts/publication-check.mjs --history
  editor:
    name: Editor after a clean installation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Install independent engine packages and fonts
        run: node scripts/studio.mjs setup --foreground --steps folders,packages,fonts
      - name: Typecheck the installed engine
        working-directory: engine
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Check editor readiness and live editing
        run: node --test --test-concurrency=1 tests/engine-dependencies.test.mjs tests/clean-install.test.mjs tests/review-live-api.test.mjs tests/review-live-follow.test.mjs tests/review-live-save.test.mjs tests/editorial-scenes.test.mjs tests/motion-primitives.test.mjs tests/graphics-audio.test.mjs tests/editor-runtime-options.test.mjs tests/project-scenes.test.mjs tests/performance-controls.test.mjs tests/alignment-workflow.test.mjs tests/emphasis-proposals.test.mjs tests/publishing-flexibility.test.mjs tests/bootstrap-profile.test.mjs tests/project-scene-example.test.mjs
